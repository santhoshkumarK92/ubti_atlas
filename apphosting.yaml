# Firebase App Hosting config. Set secrets with:
#   firebase apphosting:secrets:set SESSION_SECRET   (repeat for each secret below)
runConfig:
  minInstances: 0
  maxInstances: 4
  memoryMiB: 1024
env:
  - variable: AI_PROVIDER
    value: azure
  - variable: SITE_REQUIRE_LOGIN
    value: "false"
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
  - variable: AZURE_OPENAI_API_KEY
    secret: AZURE_OPENAI_API_KEY
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
